  const [body]=block(0,0);return{body,functions}}
function findTopOp(expr,ops){let depth=0,quote=null;for(let i=0;i<expr.length;i++){const c=expr[i];if((c==='"'||c==="'")&&expr[i-1]!=='\\')quote=quote===c?null:(quote||c);if(quote)continue;if('([{'.includes(c))depth++;if(')]}'.includes(c))depth--;if(depth===0){for(const op of ops){if(expr.slice(i,i+op.length)===op)return[i,op]}}}return null}
function evalExpr(expr,env){expr=expr.trim();if(expr.startsWith('not '))return !evalExpr(expr.slice(4),env);let hit=findTopOp(expr,[' == ',' != ',' >= ',' <= ',' > ',' < ']);if(hit){const[i,op]=hit,a=evalExpr(expr.slice(0,i),env),b=evalExpr(expr.slice(i+op.length),env);return {' == ':a==b,' != ':a!=b,' >= ':a>=b,' <= ':a<=b,' > ':a>b,' < ':a<b}[op]}
  hit=findTopOp(expr,[' + ',' - ']);if(hit){const[i,op]=hit,a=evalExpr(expr.slice(0,i),env),b=evalExpr(expr.slice(i+op.length),env);return op===' + '?a+b:a-b}
  if((expr.startsWith('"')&&expr.endsWith('"'))||(expr.startsWith("'")&&expr.endsWith("'"))){try{return JSON.parse(expr.startsWith("'")?'"'+expr.slice(1,-1).replace(/"/g,'\\"')+'"':expr)}catch{return expr.slice(1,-1)}}
  if(/^\d+(\.\d+)?$/.test(expr))return Number(expr);if(expr==='True')return true;if(expr==='False')return false;if(expr==='[]')return[];
  let m=expr.match(/^str\((.*)\)$/);if(m)return String(evalExpr(m[1],env));m=expr.match(/^len\((.*)\)$/);if(m)return evalExpr(m[1],env).length;m=expr.match(/^randint\((.*),(.*)\)$/);if(m){const a=Number(evalExpr(m[1],env)),b=Number(evalExpr(m[2],env));return Math.floor(Math.random()*(b-a+1))+a}
  if(expr==='obstacle_devant()')return obstacleFront();if(expr==='obstacle_droite()')return obstacleRight();if(expr==='obstacle_gauche()')return obstacleLeft();if(expr==='objectif_atteint()')return atGoal();if(expr==='position()')return[robot.x,robot.y];if(expr in env)return env[expr];throw new Error('Expression inconnue : '+expr)}
async function execNodes(nodes,env,functions){for(const n of nodes){if(stepMode){log(`Ligne ${n.line}`,'info');await sleep(250)}if(n.type==='pass'||n.type==='import')continue;if(n.type==='assign'){env[n.name]=evalExpr(n.expr,env);log(`${n.name} = ${JSON.stringify(env[n.name])}`,'info');continue}if(n.type==='append'){if(!Array.isArray(env[n.name]))throw new Error(n.name+' n\'est pas une liste');env[n.name].push(evalExpr(n.expr,env));continue}if(n.type==='if'){await execNodes(evalExpr(n.expr,env)?n.yes:n.no,env,functions);continue}if(n.type==='for'){const count=Number(evalExpr(n.expr,env));for(let i=0;i<count;i++){env[n.name]=i;await execNodes(n.body,env,functions)}continue}if(n.type==='forList'){const arr=env[n.list];if(!Array.isArray(arr))throw new Error(n.list+' n\'est pas une liste');for(const v of arr){env[n.name]=v;await execNodes(n.body,env,functions)}continue}if(n.type==='while'){let guard=0;while(evalExpr(n.expr,env)){if(++guard>200)throw new Error('Boucle interrompue après 200 répétitions.');await execNodes(n.body,env,functions)}continue}if(n.type==='call'){const args=n.args.map(a=>evalExpr(a,env));if(['avancer','tourner_droite','tourner_gauche','dire'].includes(n.name)){await doAction(n.name,args[0]);continue}if(n.name==='print'){log(args.join(' '),'info');continue}const f=functions[n.name];if(!f)throw new Error('Fonction inconnue : '+n.name);const local=Object.create(env);f.params.forEach((p,i)=>local[p]=args[i]);await execNodes(f.body,local,functions);continue}}
}
async function runCode(step=false){if(running)return;running=true;stepMode=step;clearConsole();resetRobot();log('Exécution démarrée.','info');try{const ast=parse(codeEl.value);await execNodes(ast.body,{},ast.functions);log(atGoal()?'Mission réussie : objectif atteint.':'Programme terminé.','ok');markCompleted()}catch(e){log('Erreur : '+e.message,'err');say('Une erreur est apparue. Lis la console.')}finally{running=false;stepMode=false;saveCode()}}
function markCompleted(){saved.completed=saved.completed||{};saved.completed[COURSE.progression[currentSession].id]=true;persist();renderProgress()}
function persist(){localStorage.setItem('neo_snt_progress',JSON.stringify(saved))}
function saveCode(){saved.codes=saved.codes||{};saved.codes[COURSE.progression[currentSession].id]=codeEl.value;persist()}
function renderProgress(){const done=Object.keys(saved.completed||{}).length;$('#progressBar').style.width=`${done/COURSE.progression.length*100}%`}
function durationLabel(m){return m>=60?`${Math.floor(m/60)} h${m%60?' '+m%60+' min':''}`:`${m} min`}
function renderSessionList(){const list=$('#sessionList');list.innerHTML='';COURSE.progression.forEach((s,i)=>{const b=document.createElement('button');b.className='session-btn'+(i===currentSession?' active':'');b.innerHTML=`<span class="num">${i}</span>${s.titre}<small>${durationLabel(s.duree_minutes)}${saved.completed?.[s.id]?' • terminé':''}</small>`;b.onclick=()=>selectSession(i);list.appendChild(b)})}
function renderSession(){const s=COURSE.progression[currentSession];$('#sessionTitle').textContent=s.titre;$('#sessionMission').textContent=s.mission;$('#competenceBadges').innerHTML=s.competences.map(c=>`<span class="badge">${c}</span>`).join('');
  $('#tab-lesson').innerHTML=`<h3>${s.accroche}</h3>${s.cours.map(c=>`<div class="course-card"><strong>${c.titre}</strong><p>${c.texte}</p></div>`).join('')}<h4>À retenir</h4><ul>${s.synthese.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  $('#tab-task').innerHTML=`<h3>Mission</h3><p>${s.consigne}</p><h4>Critères de réussite</h4>${s.tests.map(t=>`<div class="test"><span class="dot"></span><span>${t}</span></div>`).join('')}<p class="footer-note">Le bouton « Pas à pas » ralentit l'exécution et affiche les lignes exécutées.</p>`;
  $('#tab-help').innerHTML=`<h3>Indices progressifs</h3>${s.indices.map((h,i)=>`<div class="hint"><strong>Indice ${i+1}</strong><br>${h}</div>`).join('')}<h4>Commandes disponibles</h4><ul>${COURSE.robot.commandes.map(c=>`<li><code>${c.signature}</code> — ${c.effet}</li>`).join('')}</ul>`;
  const q=s.quiz?.[0];$('#tab-quiz').innerHTML=q?`<h3>Question rapide</h3><p>${q.question}</p><div id="quizChoices">${q.choix.map((x,i)=>`<button class="quiz-option" data-q="${i}">${x}</button>`).join('')}</div><div id="quizFeedback"></div>`:'<p>Aucun quiz.</p>';
  if(q)$$('.quiz-option').forEach(btn=>btn.onclick=()=>{const i=Number(btn.dataset.q);$$('.quiz-option').forEach(x=>x.disabled=true);btn.classList.add(i===q.reponse?'correct':'wrong');if(i!==q.reponse)$$('.quiz-option')[q.reponse].classList.add('correct');$('#quizFeedback').textContent=i===q.reponse?'Bonne réponse.':'À revoir dans le cours.'});
  let teacher=`<h3>Correction et conduite de séance</h3><div class="teacher-box"><strong>Solution proposée</strong><pre style="white-space:pre-wrap;font-size:.76rem">${escapeHtml(s.solution_code)}</pre><button class="btn secondary" id="loadSolutionBtn">Charger la solution</button></div>`;
  if(s.evaluation)teacher+=`<h4>Barème</h4><ul>${s.evaluation.bareme.map(b=>`<li>${b.critere} : ${b.points} points</li>`).join('')}</ul>`;$('#tab-teacher').innerHTML=teacher;setTimeout(()=>{const b=$('#loadSolutionBtn');if(b)b.onclick=()=>{codeEl.value=s.solution_code;saveCode()}},0);
  codeEl.value=saved.codes?.[s.id]??s.starter_code;resetRobot();clearConsole();log('Séance chargée : '+s.titre,'info');renderSessionList();renderProgress();saveCode()}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function selectSession(i){saveCode();currentSession=i;renderSession();}
function robotReply(q){q=q.toLowerCase().trim();if(q.includes('où')||q.includes('position'))say(`Je suis en [${robot.x}, ${robot.y}], orienté vers ${robot.dir}.`);else if(q.includes('vois')||q.includes('obstacle'))say(obstacleFront()?'Je vois un mur devant moi.':'La case devant moi est libre.');else if(q.includes('objectif')||q.includes('but')){const g=goalCell();say(`Je dois rejoindre la balise en [${g.x}, ${g.y}].`)}else if(q.includes('aide'))say('Observe, teste une petite étape, puis corrige.');else say('Question comprise : où es-tu, que vois-tu, objectif ou aide.')}
$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));$$('.tab-pane').forEach(x=>x.classList.remove('active'));t.classList.add('active');$('#tab-'+t.dataset.tab).classList.add('active')});
$('#runBtn').onclick=()=>runCode(false);$('#stepBtn').onclick=()=>runCode(true);$('#resetRobotBtn').onclick=()=>{resetRobot();clearConsole();log('Robot réinitialisé.','info')};$('#starterBtn').onclick=()=>{codeEl.value=COURSE.progression[currentSession].starter_code;saveCode()};$('#clearConsoleBtn').onclick=clearConsole;$('#chatBtn').onclick=()=>robotReply($('#chatInput').value);$('#chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')robotReply(e.target.value)});codeEl.addEventListener('input',saveCode);
$('#teacherToggle').onclick=()=>{teacherMode=!teacherMode;app.classList.toggle('teacher-mode',teacherMode);$('#teacherToggle').textContent=teacherMode?'Quitter le mode professeur':'Mode professeur'};
$('#resetProgressBtn').onclick=()=>{if(confirm('Effacer les codes et la progression enregistrés ?')){saved={};persist();renderSession();}};
$('#exportBtn').onclick=()=>{saveCode();const blob=new Blob([JSON.stringify({formation:COURSE.metadata,travail:saved},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='travail_neo_snt.json';a.click();URL.revokeObjectURL(a.href)};
$('#totalDuration').textContent=`${COURSE.progression.length} séances • ${durationLabel(COURSE.metadata.duree_totale_minutes)}`;
resetRobot(false);renderSession();draw();
</script>
</body>
